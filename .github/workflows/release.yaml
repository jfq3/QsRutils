name: Build and Release R Package

on:
  release:
    types: [published, edited]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.config.os }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest, binary: false, artifact_name: "source" }
          - { os: windows-latest, binary: true, artifact_name: "windows" }
          - { os: macos-latest, binary: true, artifact_name: "macos" }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2

      - name: Build Source Package (Linux)
        if: matrix.config.os == 'ubuntu-latest'
        run: R CMD build .

      - name: Build Binary Package (Windows)
        if: matrix.config.os == 'windows-latest'
        shell: cmd
        run: R CMD INSTALL --build .

      - name: Build Binary Package (macOS)
        if: matrix.config.os == 'macos-latest'
        run: R CMD INSTALL --build .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.config.artifact_name }}
          path: |
            *.tar.gz
            *.zip
            *.tgz          

  upload_to_release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
          merge-multiple: true

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0
          files: downloaded-artifacts/*
